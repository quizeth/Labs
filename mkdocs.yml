site_name: LearningLabs
site_description: Laboratorios y recursos de aprendizaje en datos, IA y tecnologías Microsoft
site_author: Carmela Quijano

theme:
  name: material
  language: es

  font:
    text: Inter
    code: JetBrains Mono

  palette:

    - scheme: default
      primary: indigo
      accent: teal

      toggle:
        icon: material/weather-night
        name: Activar modo oscuro

    - scheme: slate
      primary: indigo
      accent: teal

      toggle:
        icon: material/weather-sunny
        name: Activar modo claro

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - search.share

nav:
  - Inicio: index.md

  - IA y M365 Copilot para profesionales:
      - Presentación del curso: ia-copilot-profesionales/index.md
      - Recursos del curso: ia-copilot-profesionales/recursos/index.md
      - Primeros pasos con Microsoft 365 Copilot: ia-copilot-profesionales/lab1.md
      - Técnicas de prompting aplicadas a datos empresariales: ia-copilot-profesionales/lab2.md
      - Análisis documental avanzado con Copilot Notebooks: ia-copilot-profesionales/lab3.md
      - Crear y probar un agente con Microsoft 365 Copilot: ia-copilot-profesionales/lab4.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true